<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>临时邮箱服务</title>
    <meta name="description" content="免费的临时邮箱服务，保护您的隐私" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 主容器 -->
    <div class="container">
      <!-- 头部 -->
      <header class="header">
        <h1 class="title">✉️ 临时邮箱</h1>
        <p class="subtitle">保护隐私，即刻使用</p>
      </header>

      <!-- 邮箱创建区域 -->
      <section class="email-creator">
        <div class="input-group">
          <input
            type="text"
            id="emailInput"
            class="email-input"
            placeholder="设置电子邮件ID"
            autocomplete="off"
          />
          <div class="domain-selector">
            <button class="domain-button" id="domainButton">
              @example.com
              <svg
                class="dropdown-icon"
                width="12"
                height="12"
                viewBox="0 0 12 12"
                fill="none"
              >
                <path
                  d="M3 4.5L6 7.5L9 4.5"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </button>
            <ul class="domain-dropdown" id="domainDropdown"></ul>
          </div>
        </div>

        <div class="button-group">
          <button class="btn btn-primary" id="createBtn">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path
                d="M2 8L6 12L14 4"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            创建
          </button>
          <button class="btn btn-secondary" id="randomBtn">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path
                d="M4 6L2 4L4 2M12 10L14 12L12 14M2 4H10C11.1046 4 12 4.89543 12 6V8M14 12H6C4.89543 12 4 11.1046 4 10V8"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
            随机
          </button>
        </div>

        <div class="divider">或者</div>

        <button class="btn btn-manage" id="manageBtn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path
              d="M8 10V14M3 10V14M13 10V14M1 4H15M3 4V10M13 4V10M8 4V10"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
          管理邮箱后缀
        </button>
      </section>

      <!-- 当前邮箱显示 -->
      <section
        class="current-mailbox"
        id="currentMailbox"
        style="display: none"
      >
        <div class="mailbox-info">
          <span class="mailbox-label">当前邮箱:</span>
          <span class="mailbox-address" id="mailboxAddress"></span>
          <button class="copy-btn" id="copyBtn" title="复制邮箱地址">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <rect
                x="5"
                y="5"
                width="9"
                height="9"
                rx="1"
                stroke="currentColor"
                stroke-width="1.5"
              />
              <path
                d="M3 11V3C3 2.44772 3.44772 2 4 2H10"
                stroke="currentColor"
                stroke-width="1.5"
              />
            </svg>
          </button>
        </div>
        <button class="refresh-btn" id="refreshBtn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path
              d="M14 8C14 11.3137 11.3137 14 8 14C4.68629 14 2 11.3137 2 8C2 4.68629 4.68629 2 8 2C9.84957 2 11.4978 2.87707 12.5355 4.24264M12.5355 4.24264V1M12.5355 4.24264H9.29289"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
          刷新邮件
        </button>
      </section>

      <!-- 邮件列表 -->
      <section
        class="email-list-section"
        id="emailListSection"
        style="display: none"
      >
        <h2 class="section-title">收件箱</h2>
        <div class="email-list" id="emailList">
          <div class="empty-state">
            <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
              <rect
                x="8"
                y="16"
                width="48"
                height="32"
                rx="2"
                stroke="currentColor"
                stroke-width="2"
              />
              <path
                d="M8 20L32 36L56 20"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            <p>暂无邮件</p>
          </div>
        </div>
      </section>

      <!-- 邮件详情 -->
      <div class="email-detail-modal" id="emailDetailModal">
        <div class="modal-content">
          <div class="modal-header">
            <h3 id="emailSubject"></h3>
            <button class="close-btn" id="closeModalBtn">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path
                  d="M6 6L18 18M6 18L18 6"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </div>
          <div class="modal-meta">
            <div class="meta-item">
              <span class="meta-label">发件人:</span>
              <span class="meta-value" id="emailFrom"></span>
            </div>
            <div class="meta-item">
              <span class="meta-label">时间:</span>
              <span class="meta-value" id="emailTime"></span>
            </div>
          </div>
          <div class="modal-body" id="emailBody"></div>
          <div class="modal-footer">
            <button class="btn btn-danger" id="deleteEmailBtn">删除邮件</button>
          </div>
        </div>
      </div>

      <!-- 域名管理模态框 -->
      <div class="domain-management-modal" id="domainManagementModal">
        <div class="modal-content">
          <div class="modal-header">
            <h3>管理邮箱后缀</h3>
            <button class="close-btn" id="closeDomainModalBtn">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path
                  d="M6 6L18 18M6 18L18 6"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </div>
          <div class="modal-body">
            <div class="add-domain-section">
              <input
                type="text"
                id="newDomainInput"
                class="domain-input"
                placeholder="输入新的域名，例如: example.com"
              />
              <button class="btn btn-primary" id="addDomainBtn">添加</button>
            </div>
            <div class="domain-list" id="domainList"></div>
          </div>
        </div>
      </div>

      <!-- Kuro 品牌标识 -->
      <footer class="kuro-signature">
        <div class="signature-content">
          <span class="made-by">Made with</span>
          <svg class="heart-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M8 14L1.5 7.5C0.5 6.5 0.5 4.5 1.5 3.5C2.5 2.5 4.5 2.5 5.5 3.5L8 6L10.5 3.5C11.5 2.5 13.5 2.5 14.5 3.5C15.5 4.5 15.5 6.5 14.5 7.5L8 14Z" fill="currentColor"/>
          </svg>
          <span class="made-by">by</span>
          <span class="kuro-name">Kuro</span>
        </div>
      </footer>
    </div>

    <!-- Toast 通知 -->
    <div class="toast" id="toast"></div>

    <!-- 加载脚本 -->
    <script src="app.js"></script>
  </body>
</html>
