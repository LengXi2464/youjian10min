# Cloudflare Workers 配置文件

name = "temp-email-service"
main = "api-worker.js"
compatibility_date = "2024-01-01"

# KV 命名空间绑定
[[kv_namespaces]]
binding = "EMAIL_STORAGE"
id = "YOUR_KV_NAMESPACE_ID"  # 需要替换为实际的 KV 命名空间 ID

# 路由配置 - API Worker
[[routes]]
pattern = "api.your-domain.com/*"  # 需要替换为您的 API 域名
zone_name = "your-domain.com"  # 需要替换为您的域名

# Email Worker 配置（单独部署）
# 使用命令: wrangler deploy email-worker.js --name temp-email-receiver
# 然后在 Cloudflare Dashboard 中配置 Email Routing

[env.production]
name = "temp-email-api"
kv_namespaces = [
  { binding = "EMAIL_STORAGE", id = "YOUR_KV_NAMESPACE_ID" }
]

[env.email]
name = "temp-email-receiver"
main = "email-worker.js"
kv_namespaces = [
  { binding = "EMAIL_STORAGE", id = "YOUR_KV_NAMESPACE_ID" }
]
