<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="免费临时电子邮件 - 保护您的隐私，防止垃圾邮件">
    <title>免费临时电子邮件 - Temp Mail</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <nav class="nav-container">
            <a href="/" class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                Temp Mail
            </a>
        </nav>
    </header>

    <!-- 主内容区 -->
    <main class="main-container">
        <!-- Hero Section -->
        <section class="hero-section">
            <h1 class="hero-title">免费临时电子邮件</h1>
            <p class="hero-description">
                保持您的真实电子邮箱地址私密和安全。临时邮箱可以保护您免受垃圾邮件、广告邮件、恶意软件和机器人侵害。通过使用一次性电子邮件来保护您的隐私。
            </p>    
        </section>

        <!-- 邮箱控制面板 -->
        <section class="email-panel">
            <div class="email-display">
                <div class="email-input-wrapper">
                    <input 
                        type="text" 
                        class="email-address-display" 
                        id="emailAddress" 
                        readonly 
                        placeholder="加载中..."
                    >
                    <button class="copy-btn-inline" id="copyInline" title="复制">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="action-buttons">
                <button class="action-btn" id="copyBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                    <span>复制</span>
                </button>

                <button class="action-btn" id="randomBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                    </svg>
                    <span>随机</span>
                </button>

                <button class="action-btn" id="changeBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                    <span>改变</span>
                </button>

                <button class="action-btn" id="deleteBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    <span>删除</span>
                </button>

                <button class="action-btn" id="moreBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="1"></circle>
                        <circle cx="12" cy="5" r="1"></circle>
                        <circle cx="12" cy="19" r="1"></circle>
                    </svg>
                    <span>更多</span>
                </button>
            </div>
        </section>

        <!-- 邮件列表区域 -->
        <section class="messages-section">
            <div class="messages-header">
                <h2 class="messages-title">消息</h2>
                <button class="refresh-btn" id="refreshBtn">
                    <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <polyline points="1 20 1 14 7 14"></polyline>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                    </svg>
                    <span>刷新</span>
                </button>
            </div>

            <div class="messages-list" id="messagesList">
                <!-- 空状态 -->
                <div class="empty-state">
                    <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    <p class="empty-text">没有新消息</p>
                </div>
            </div>
        </section>
    </main>

    <!-- 自定义邮箱模态框 -->
    <div class="modal" id="changeEmailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">自定义邮箱地址</h3>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            
            <form id="customEmailForm">
                <div class="form-group">
                    <label class="form-label" for="emailPrefix">邮箱前缀</label>
                    <input 
                        type="text" 
                        class="form-input" 
                        id="emailPrefix" 
                        placeholder="输入自定义前缀"
                        pattern="[a-zA-Z0-9._-]+"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="emailDomain">选择域名</label>
                    <select class="form-select" id="emailDomain" required>
                        <option value="">加载中...</option>
                    </select>
                </div>
                
                <button type="submit" class="btn-primary">确认更改</button>
            </form>
        </div>
    </div>

    <!-- 邮件详情模态框 -->
    <div class="modal" id="messageModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">邮件详情</h3>
                <button class="modal-close" id="closeMessageModal">&times;</button>
            </div>
            
            <div id="messageDetails">
                <!-- 动态加载邮件内容 -->
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-simple">
                <p>&copy; 2026 Temp Mail by Kuro. 保留所有权利。</p>
                <p class="kuro-badge-footer">由 Kuro 制作</p>
            </div>
        </div>
    </footer>

    <!-- Cookie 提示 -->
    <div class="cookie-notice" id="cookieNotice">
        <p class="cookie-text">
            我们使用 Cookie 来改善您的浏览体验。继续使用本网站即表示您同意我们使用 Cookie。
        </p>
        <button class="cookie-accept" id="acceptCookie">了解了</button>
    </div>

    <script src="app-main.js"></script>
</body>
</html>
